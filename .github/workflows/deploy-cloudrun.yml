name: Deploy to Cloud Run (Source-based)

on:
  push:
    branches: [ "main" ]   # Sesuaikan kalau kamu pakai branch lain

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    # 1) Auth ke Google Cloud pakai service account JSON
    - name: Google Auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    # 2) Install gcloud dan set default project
    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}
        version: "latest"

    # 3) Deploy ke Cloud Run pake source-based deploy (tanpa Dockerfile)
    - name: Deploy to Cloud Run
      env:
        SERVICE_NAME: ${{ secrets.CLOUD_RUN_SERVICE }}
        GCP_REGION: ${{ secrets.GCP_REGION }}
      run: |
        gcloud run deploy $SERVICE_NAME \
          --source . \
          --region $GCP_REGION \
          --platform managed \
          --service-account id-22637742268-compute-develop@cicd-mlops-training.iam.gserviceaccount.com \
          --allow-unauthenticated
