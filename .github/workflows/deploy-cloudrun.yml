name: Deploy to Cloud Run (Image-based)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Google Auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}
        version: "latest"

    - name: Build and Push Container to Artifact Registry
      run: |
        gcloud builds submit \
          --tag asia-southeast2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-repo/${{ secrets.CLOUD_RUN_SERVICE }}

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy ${{ secrets.CLOUD_RUN_SERVICE }} \
          --image asia-southeast2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-repo/${{ secrets.CLOUD_RUN_SERVICE }} \
          --region ${{ secrets.GCP_REGION }} \
          --service-account id-22637742268-compute-develop@cicd-mlops-training.iam.gserviceaccount.com \
          --allow-unauthenticated \
          --quiet